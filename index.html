<!DOCTYPE html>
<html>
<head>
    <title>Mening saytim 🚀</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
            color: white;

            background:
                radial-gradient(circle at top, #3b0066, #09001a 60%, #000);
        }

        /* YULDUZLAR */

        .yulduz {
            position: fixed;

            width: 4px;
            height: 4px;

            background: white;
            border-radius: 50%;

            box-shadow:
                0 0 10px white;

            animation: uchish 5s linear infinite;
        }

        @keyframes uchish {
            from {
                transform: translateY(0);
                opacity: 1;
            }

            to {
                transform: translateY(-110vh);
                opacity: 0;
            }
        }

        /* ASOSIY BOX */

        .box {
            position: relative;
            z-index: 10;

            width: 600px;
            padding: 60px 40px;

            text-align: center;

            border-radius: 35px;

            background: rgba(255,255,255,0.08);

            backdrop-filter: blur(15px);

            border: 1px solid rgba(255,255,255,0.2);

            box-shadow:
                0 0 50px rgba(150,0,255,0.4);

            animation: paydo 1.2s ease;
        }

        @keyframes paydo {
            from {
                opacity: 0;
                transform: scale(0.7) translateY(50px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* Sarlavha */

        h1 {
            margin: 0;

            font-size: 60px;

            background:
                linear-gradient(
                    90deg,
                    #00ffff,
                    #ff00ff,
                    #ffff00
                );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            animation: rang 3s linear infinite;
        }

        @keyframes rang {
            0% {
                filter: hue-rotate(0deg);
            }

            100% {
                filter: hue-rotate(360deg);
            }
        }

        h2 {
            font-size: 24px;
            margin-top: 15px;

            color: #ddd;
        }

        p {
            font-size: 18px;
            color: #bbb;

            margin: 25px 0 35px;
        }

        /* TUGMA */

        .kirish {
            display: inline-block;

            padding: 17px 45px;

            border-radius: 40px;

            text-decoration: none;

            color: white;

            font-size: 20px;
            font-weight: bold;

            background:
                linear-gradient(
                    135deg,
                    #00c6ff,
                    #7f00ff,
                    #ff00aa
                );

            box-shadow:
                0 0 20px rgba(0,200,255,0.5);

            transition: 0.3s;
        }

        .kirish:hover {
            transform: scale(1.12);

            box-shadow:
                0 0 20px #00ffff,
                0 0 50px #ff00ff;
        }

        /* PASTKI YOZUV */

        .past {
            margin-top: 35px;

            font-size: 14px;

            color: #888;
        }

        /* TELEFON UCHUN */

        @media (max-width: 650px) {

            .box {
                width: 90%;
                padding: 45px 20px;
            }

            h1 {
                font-size: 42px;
            }

            h2 {
                font-size: 20px;
            }
        }
    </style>
</head>


<body>


    <!-- YULDUZLAR -->

    <div class="yulduz" style="left:10%; top:90%; animation-delay:0s;"></div>

    <div class="yulduz" style="left:20%; top:70%; animation-delay:1s;"></div>

    <div class="yulduz" style="left:35%; top:100%; animation-delay:2s;"></div>

    <div class="yulduz" style="left:50%; top:80%; animation-delay:0.5s;"></div>

    <div class="yulduz" style="left:65%; top:95%; animation-delay:1.5s;"></div>

    <div class="yulduz" style="left:80%; top:75%; animation-delay:2.5s;"></div>

    <div class="yulduz" style="left:90%; top:100%; animation-delay:3s;"></div>


    <!-- ASOSIY QISM -->

    <div class="box">

        <h1>🚀 Salom!</h1>

        <h2>
            Mening shaxsiy saytimga xush kelibsiz
        </h2>

        <p>
            Bu saytni o‘zim yaratdim 😎<br>
            Ichkarida sizni qiziqarli narsalar kutmoqda!
        </p>


        <!-- 2-SAHIFAGA O'TISH -->

        <a href="keyingi.html" class="kirish">
            🚀 Kirish
        </a>


        <div class="past">
            ✨ HTML • CSS • JavaScript ✨
        </div>

    </div>


</body>
</html>
